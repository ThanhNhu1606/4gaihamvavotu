<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#2b1d0e;
  display:flex;flex-direction:column;align-items:center;
  font-family:'Nunito',sans-serif;
}

/* ── TOP BAR ─────────────────────────────────── */
#topbar{
  width:100%;max-width:900px;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 4px;
  flex-shrink:0;
}
#topbar h1{
  font-family:'Nunito',cursive;
  font-size:22px;color:#ffe066;
  text-shadow:0 2px 0 #a05c00,0 3px 0 #7a4200;
  letter-spacing:1px;
}
.hud-pill{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.22);
  border-radius:999px;
  padding:4px 14px;
}
.hud-pill .label{font-size:11px;color:#ffd88a;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.hud-pill .val{font-size:17px;font-weight:900;color:#fff;font-family:'Nunito',cursive;}
.hud-pill .val.green{color:#a8ff78;}
.hud-pill .val.red{color:#ff7f7f;}
.hud-pill .val.blue{color:#a0d8ff;}
.hud-pill .val.yellow{color:#ffe066;}

/* ── WRAP ──────────────────────────────────── */
#wrap{position:relative;flex-shrink:0;}
canvas{display:block;border-radius:16px;border:3px solid rgba(255,220,100,.3);}

/* ── OVERLAY SHARED ────────────────────────── */
.overlay{
  position:absolute;inset:0;border-radius:14px;
  background:rgba(30,15,5,.88);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:28px;
  backdrop-filter:blur(4px);
}
.ov-panel{
  background:#fff8ee;border-radius:20px;
  border:4px solid #f5c842;
  padding:28px 36px;text-align:center;
  max-width:480px;width:100%;
  box-shadow:0 8px 0 #b8860b,0 10px 24px rgba(0,0,0,.4);
}
.ov-panel h2{
  font-family:'Nunito',cursive;
  font-size:28px;color:#c46000;
  text-shadow:0 2px 0 #f5c842;margin-bottom:8px;
}
.ov-panel p{font-size:14px;color:#6b3a00;font-weight:700;line-height:1.5;}

/* ── BUTTONS ────────────────────────────────── */
.btn{
  font-family:'Nunito',cursive;
  font-size:17px;letter-spacing:.5px;
  padding:11px 32px;border:none;border-radius:999px;cursor:pointer;
  transition:transform .1s,box-shadow .1s;
  box-shadow:0 5px 0 rgba(0,0,0,.3);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3);}
.btn-gold{background:#f5c842;color:#6b3a00;}
.btn-gold:hover{background:#ffd860;}
.btn-green{background:#7ecc4a;color:#1e4a00;}
.btn-green:hover{background:#96e05a;}

/* ── SHOP ───────────────────────────────────── */
#shop-title{font-family:'Nunito',cursive;font-size:26px;color:#c46000;text-shadow:0 2px 0 #f5c842;margin-bottom:2px;}
#shop-sub{font-size:13px;color:#6b3a00;font-weight:700;margin-bottom:10px;}
#shop-money{color:#c46000;}
#shop-items{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  max-height:260px;overflow-y:auto;
  scrollbar-width:none;
}
#shop-items::-webkit-scrollbar{display:none;}
.scard{
  background:#fffbf0;border:3px solid #f0d080;border-radius:16px;
  padding:12px 14px;width:150px;text-align:center;
  transition:transform .12s,border-color .12s;
  box-shadow:0 4px 0 #c8a030;
}
.scard:hover{transform:translateY(-2px);border-color:#f5c842;}
.scard .sname{font-family:'Nunito',cursive;font-size:14px;color:#7a3800;margin-bottom:3px;}
.scard .sdesc{font-size:11px;color:#a06020;line-height:1.4;min-height:32px;}
.scard button{
  margin-top:8px;width:100%;
  font-family:'Nunito',cursive;font-size:13px;
  padding:6px 10px;border:none;border-radius:999px;cursor:pointer;
  background:#f5c842;color:#6b3a00;
  box-shadow:0 3px 0 #b8860b;
  transition:background .1s,transform .1s;
}
.scard button:hover:not(:disabled){background:#ffd860;}
.scard button:disabled{background:#ccc;color:#888;box-shadow:none;cursor:default;}

/* ── TOGGLES ────────────────────────────────── */
#toggles{
  position:absolute;bottom:10px;right:10px;
  display:flex;gap:6px;
}
#toggles button{
  font-size:16px;width:36px;height:36px;border-radius:999px;border:2px solid rgba(255,220,100,.4);
  background:rgba(0,0,0,.45);color:#fff;cursor:pointer;
  transition:background .15s;
}
#toggles button:hover{background:rgba(255,220,100,.25);}
#toggles button.off{opacity:.4;}

#shop-no{
  transition:left .15s ease, top .15s ease;
}

</style>
</head>

<script>
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const GROUND_Y=Math.round(H*0.30);
const PIVOT={x:W/2,y:GROUND_Y-6};

function loadImg(src){const i=new Image();i.src=src;i.ok=false;i.onload=()=>i.ok=true;return i;}
const faceImg=loadImg('assets/face.png');
const catImg=loadImg('assets/money.png');
const cat2Img=loadImg('assets/food.png');
const cat3Img=loadImg('assets/gian.png');
const vesoImg=loadImg('assets/veso.jpg');
const otoImg=loadImg('assets/oto.png');
const ROCK_IMGS=[catImg,cat2Img,cat3Img];

const CAT_TIERS=[ 
  {r:28,value:50,w:0.8},
  {r:36,value:120,w:1.6},
  {r:44,value:240,w:2.8},
  {r:54,value:400,w:4.2},
];
function pickCatTier(){const x=Math.random();return x<0.34?0:x<0.64?1:x<0.85?2:3;}

const IELTS_Q=[
  {kind:'1',text:'Chuồn chuồn bay thấp thì cao, bay cao thì thấp, bay vừa thì ok.'},
  {kind:'2',text:'If this year we can’t fall in love, wait next year so we can love in fall.'},
  {kind:'3',text:'Đi vào tiệm net like a boss, bước ra tiệm net lost a bike.'},
  {kind:'4',text:'Kệ họ đi em, cứ sống cuộc đời của mình thôi. Nắng chiếu đến ai, người đó đen'},
  {kind:'5',text:'Chuyện gì dù có khó khăn đến mấy mà người khác làm được thì để họ làm.'},
  {kind:'6',text:'Trên thế giới có 2 loại người 1 là người này hay là người kia.'},
];

function rand(a,b){return a+Math.random()*(b-a);}
function rint(a,b){return Math.floor(rand(a,b+1));}

let audioOn=true,actx=null;
function AC(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}return actx;}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!audioOn)return;const a=AC();if(!a)return;
  const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);
}
function noiseBurst(dur,vol){
  if(!audioOn)return;const a=AC();if(!a)return;
  const t=a.currentTime,n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const src=a.createBufferSource();src.buffer=buf;const g=a.createGain();g.gain.value=vol||0.3;
  src.connect(g);g.connect(a.destination);src.start(t);
}
function sfxShoot(){tone(720,0.16,'square',0.10,180);}
function sfxGrab(){tone(240,0.05,'square',0.16);}
function sfxMeow(){tone(600,0.12,'sawtooth',0.13,880);tone(880,0.16,'sawtooth',0.11,430,0.11);}
function sfxCoin(v){const hi=v>=240?1320:v>=120?1180:1046;tone(784,0.07,'square',0.12);tone(hi,0.13,'square',0.12,null,0.07);}
function sfxThud(){tone(140,0.18,'sine',0.20,70);noiseBurst(0.12,0.07);}
function sfxSparkle(){tone(1568,0.08,'triangle',0.12);tone(2093,0.1,'triangle',0.10,null,0.06);tone(2637,0.12,'triangle',0.09,null,0.12);}
function sfxChime(){tone(1046,0.12,'sine',0.12);tone(1318,0.15,'sine',0.11,null,0.1);}
function sfxExplode(){noiseBurst(0.4,0.32);tone(120,0.3,'sawtooth',0.22,40);}
function sfxWin(){[523,659,784,1046].forEach((f,i)=>tone(f,0.18,'square',0.14,null,i*0.12));}
function sfxLose(){[400,330,260].forEach((f,i)=>tone(f,0.22,'sawtooth',0.14,null,i*0.14));}
// function sfxCollect(type,v){
//   if(type==='cat'){sfxMeow();sfxCoin(v);}
//   else if(type==='diamond')sfxSparkle();
//   else if(type==='rock')sfxThud();
//   else if(type==='ielts'){sfxThud();if(ieltsOn)sfxChime();}
//   else sfxCoin(v);
// }

const moneySound = new Audio('assets/sound/money.mp3');

function sfxCollect(type,v){
  if(type==='cat'){

    if(audioOn){
      moneySound.currentTime = 0; // cho phép phát lại liên tục
      moneySound.play();
    }

    // sfxCoin(v);
  }
  else if(type==='diamond'){
    sfxSparkle();
  }
  else if(type==='rock'){
    sfxThud();
  }
  else if(type==='ielts'){
    sfxThud();
    if(ieltsOn) sfxChime();
  }
  else{
    sfxCoin(v);
  }
}


/* ── BACKGROUND ──────────────────────────────── */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
const bgx=bg.getContext('2d');
let clouds=[];

function buildBackground(){
  // Sky gradient — warm dusk gold/amber
  let sky=bgx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0, '#29B6F6');
sky.addColorStop(0.35, '#4DD0E1');
sky.addColorStop(0.7, '#80CBC4');
sky.addColorStop(1, '#E0F2F1');
  bgx.fillStyle=sky;bgx.fillRect(0,0,W,GROUND_Y);

  // Stars
  for(let i=0;i<60;i++){
    const sx=rand(0,W),sy=rand(0,GROUND_Y*0.7),sr=rand(0.5,1.8);
    bgx.fillStyle=`rgba(255,240,180,${rand(0.4,0.9)})`;
    bgx.beginPath();bgx.arc(sx,sy,sr,0,7);bgx.fill();
  }

  // Distant silhouette hills
  function hill(baseY,amp,color){
    bgx.fillStyle=color;bgx.beginPath();bgx.moveTo(0,baseY);
    for(let x=0;x<=W;x+=35)bgx.lineTo(x,baseY-Math.abs(Math.sin(x*0.009+baseY*0.1))*amp-rand(0,8));
    bgx.lineTo(W,GROUND_Y);bgx.lineTo(0,GROUND_Y);bgx.closePath();bgx.fill();
  }
  hill(GROUND_Y-28,90,'#2E7D32');
hill(GROUND_Y-16,55,'#26A69A');
hill(GROUND_Y-6,32,'#66BB6A');

  // Grass strip — warm golden green
  let grass=bgx.createLinearGradient(0,GROUND_Y-22,0,GROUND_Y);
  grass.addColorStop(0,'#c8a030');
  grass.addColorStop(1,'#7a5a18');
  bgx.fillStyle=grass;bgx.fillRect(0,GROUND_Y-22,W,22);
  bgx.fillStyle='rgba(255,230,120,.15)';bgx.fillRect(0,GROUND_Y-22,W,3);
  // grass tufts
  bgx.fillStyle='#a07820';
  for(let x=10;x<W;x+=rint(35,80)){bgx.beginPath();bgx.ellipse(x,GROUND_Y-20,rand(5,13),rand(3,7),0,0,7);bgx.fill();}

  // Underground — layered golden/amber soil
  const soilColors=['#c87828','#b06020','#985018','#804012'];
  const soilH=(H-GROUND_Y)/soilColors.length;
  soilColors.forEach((c,i)=>{bgx.fillStyle=c;bgx.fillRect(0,GROUND_Y+i*soilH,W,soilH+1);});

  // Soil grain veins
  for(let i=0;i<5;i++){
    const y0=GROUND_Y+(i+1)*(H-GROUND_Y)/6;
    bgx.strokeStyle=`rgba(255,200,80,${rand(.08,.18)})`;bgx.lineWidth=rand(8,20);
    bgx.beginPath();bgx.moveTo(0,y0);
    for(let x=0;x<=W;x+=28)bgx.lineTo(x,y0+Math.sin(x*0.025+i)*16);
    bgx.stroke();
  }
  // Pebbles
  for(let k=0;k<100;k++){
    bgx.fillStyle=`rgba(80,40,10,${rand(.12,.3)})`;
    bgx.beginPath();bgx.ellipse(rand(0,W),rand(GROUND_Y+6,H),rand(2,5),rand(1.5,3.5),rand(0,3),0,7);bgx.fill();
  }

  clouds=[];
  for(let i=0;i<4;i++)clouds.push({x:rand(0,W),y:rand(18,GROUND_Y-60),s:rand(.6,1.1),v:rand(5,12)});
}

function drawCloud(c){
  // Warm amber-tinted cloud
  ctx.fillStyle='rgba(255,210,130,.55)';const s=c.s;
  ctx.beginPath();
  ctx.ellipse(c.x,c.y,32*s,18*s,0,0,7);
  ctx.ellipse(c.x+26*s,c.y+5*s,22*s,14*s,0,0,7);
  ctx.ellipse(c.x-26*s,c.y+5*s,20*s,13*s,0,0,7);
  ctx.ellipse(c.x,c.y+9*s,36*s,14*s,0,0,7);
  ctx.fill();
}

/* ── STATE ───────────────────────────────────── */
let items=[],particles=[],floatTexts=[],hook,score,target,cumulativeGoal=0,timeLeft,level,running,reelSpin=0;
let dynamite=0,pullBoost=1,cloverMul=1,rockMul=1,bonusTime=0;
let boardValue=0,banner=null,ieltsOn=true;
let lastTs=0;

/* ── ITEMS ───────────────────────────────────── */
function makeItems(){
  items=[];
  const nCat=5+Math.floor(level/2),nRock=3+Math.floor(level*0.9),
        nDia=(level>=3?1:0)+(level>=6?1:0),nIelts=ieltsOn?(1+Math.floor(level/4)):0;
  const plan=[];
  for(let i=0;i<nCat;i++)plan.push('cat');
  for(let i=0;i<nRock;i++)plan.push('rock');
  for(let i=0;i<nDia;i++)plan.push('diamond');
  for(let i=0;i<nIelts;i++)plan.push('ielts');
  plan.push('mystery');
  let tries=0;
  for(const type of plan){
    let placed=false;
    while(!placed&&tries<1500){
      tries++;
      const tier=type==='cat'?CAT_TIERS[pickCatTier()]:null;
      let r=type==='cat'?tier.r:(type==='rock'||type==='ielts')?rand(22,36+level*2):type==='diamond'?14:20;
      const x=rand(r+12,W-r-12),y=rand(GROUND_Y+80,H-r-12);
      if(items.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r+10))continue;
      let value,weight,img=0,q=null;
      if(type==='cat'){value=tier.value;weight=tier.w;}
      else if(type==='rock'){value=rint(4,12)*rockMul;weight=3+r/12;}
      else if(type==='diamond'){value=280;weight=0.7;}
      else if(type==='ielts'){value=rint(4,12);weight=3+r/12;img=rint(0,2);q=IELTS_Q[rint(0,IELTS_Q.length-1)];}
      else{value=[40,80,150,220,15][rint(0,4)]*cloverMul;weight=1.0;}
      items.push({type,x,y,r,value,weight,img,q,gone:false});
      placed=true;
    }
  }
  const rocks=items.filter(o=>o.type==='rock');
  if(rocks.length){
    const idx=[];
    for(let i=0;i<rocks.length;i++)idx.push(i<3?i%3:rint(0,2));
    for(let i=idx.length-1;i>0;i--){const j=rint(0,i);[idx[i],idx[j]]=[idx[j],idx[i]];}
    rocks.forEach((o,i)=>o.img=idx[i]);
  }
  boardValue=items.reduce((s,o)=>s+((o.type==='rock'||o.type==='ielts')?0:o.value),0);
}

function newLevel(reset){
  if(reset){score=0;level=1;dynamite=0;cumulativeGoal=0;pullBoost=1;cloverMul=1;rockMul=1;bonusTime=0;}
  else{level++;}
  makeItems();
  const frac=Math.min(0.85,0.55+level*0.03);
  const need=Math.max(300,Math.round(boardValue*frac));
  cumulativeGoal+=need;target=cumulativeGoal;
  timeLeft=Math.max(35,60-(level-1)*2.5)+bonusTime;
  // timeLeft=2+bonusTime;
  bonusTime=0;
  hook={angle:0,dir:1,swingSpeed:1.4+level*0.12,state:'swing',len:30,payload:null};
  particles=[];floatTexts=[];
  running=true;
  document.getElementById('result').style.display='none';
  document.getElementById('shop').style.display='none';
}

const HOOK_MIN=30,HOOK_MAX=Math.hypot(W/2,H-PIVOT.y)+20,SHOOT_SPEED=540;
function fireHook(){if(running&&hook.state==='swing'){hook.state='out';sfxShoot();}}
function hookTip(){return{x:PIVOT.x+Math.sin(hook.angle)*hook.len,y:PIVOT.y+Math.cos(hook.angle)*hook.len};}

function useDynamite(){
  if(running&&hook.state==='in'&&hook.payload&&dynamite>0){
    explode(hook.payload.x,hook.payload.y,hook.payload.type==='rock'?'#ffb86c':'#ffe066');
    sfxExplode();hook.payload.gone=true;hook.payload=null;dynamite--;
  }
}
function explode(x,y,color){
  for(let i=0;i<22;i++){
    const a=rand(0,7),sp=rand(60,200);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rand(.35,.8),c:color,r:rand(2,5)});
  }
}
function addFloatText(x,y,text,color){
  floatTexts.push({x,y,text,color,life:1.2,vy:-55});
}

/* ── UPDATE ──────────────────────────────────── */
function update(dt){
  for(const c of clouds){c.x+=c.v*dt;if(c.x-60>W)c.x=-60;}
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
  for(const f of floatTexts){f.x+=0;f.y+=f.vy*dt;f.life-=dt;}
  floatTexts=floatTexts.filter(f=>f.life>0);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}
  if(!running)return;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;return endLevel();}

  if(hook.state==='swing'){
    hook.angle+=hook.dir*hook.swingSpeed*dt;
    if(hook.angle>1.28){hook.angle=1.28;hook.dir=-1;}
    if(hook.angle<-1.28){hook.angle=-1.28;hook.dir=1;}
  }else if(hook.state==='out'){
    hook.len+=SHOOT_SPEED*dt;
    const tip=hookTip();
    if(hook.len>=HOOK_MAX||tip.x<0||tip.x>W||tip.y>H){hook.state='in';}
    else for(const o of items){
      if(o.gone)continue;
      if(Math.hypot(tip.x-o.x,tip.y-o.y)<o.r){hook.payload=o;hook.state='in';sfxGrab();break;}
    }
  }else if(hook.state==='in'){
    let speed=hook.payload?SHOOT_SPEED/(1.2+hook.payload.weight*1.6):SHOOT_SPEED*1.4;
    speed*=pullBoost;
    hook.len-=speed*dt;
    reelSpin-=speed*dt*0.04;
    if(hook.payload){const tip=hookTip();hook.payload.x=tip.x;hook.payload.y=tip.y;}
    if(hook.len<=HOOK_MIN){
      hook.len=HOOK_MIN;
      if(hook.payload){
        score+=hook.payload.value;
        if(ieltsOn&&hook.payload.type==='ielts')showBanner(hook.payload.q);
        addFloatText(hook.payload.x,GROUND_Y-30,'+$'+hook.payload.value,
          hook.payload.type==='diamond'?'#a0d8ff':hook.payload.type==='cat'?'#ffe066':'#ffb86c');
        sfxCollect(hook.payload.type,hook.payload.value);
        hook.payload.gone=true;hook.payload=null;
      }
      hook.state='swing';
      if(score>=target)return endLevel();
    }
  }
  updateHUD();
}

function updateHUD(){
  document.getElementById('hud-score').textContent='$'+score;
  document.getElementById('hud-target').textContent='$'+target;
  const t=Math.ceil(timeLeft);
  const el=document.getElementById('hud-time');
  el.textContent=t+'s';
  el.className='val'+(t<=10?' red':' ');
  document.getElementById('hud-level').textContent=level;
}

function endLevel(){
  running=false;
  updateHUD();
  const won=score>=target;
  if(won){sfxWin();openShop();return;}
  sfxLose();
  document.getElementById('ov-title').innerHTML =
  'Hết giờ roàii!<br>Đẹp gái thì chơi lại<br>Ko thì cũng đẹp gái🤡';
  document.getElementById('ov-msg').innerHTML =
  'Bạn đạt $' + score + ', cần $' + target +
  '.<br>Sớm muộn cũng thành cong =))';
  document.getElementById('result').style.display='flex';
}

/* ── SHOP ────────────────────────────────────── */
const SHOP=[
  {key:'dyn',name:'🧨 Mìn (+1)',base:55,inc:18,once:false,desc:'Phá vật đang kéo.\nKích hoạt bằng phím ⬆'},
  {key:'pot',name:'💪 Tăng lực',base:80,inc:24,once:true,desc:'Kéo nhanh hơn 80% màn tới.'},
  {key:'cof',name:'☕ Cà phê +8s',base:70,inc:22,once:true,desc:'Thêm 8 giây màn tới.'},
  {key:'clov',name:'🍀 Cỏ 4 lá',base:65,inc:16,once:true,desc:'Túi bí ẩn x2 giá trị.'},
  {key:'book',name:'📖 Sách đá',base:50,inc:12,once:true,desc:'Đá x3 giá trị màn tới.'},
];
function priceOf(it){return it.base+level*it.inc;}
function openShop(){
  pullBoost=1;cloverMul=1;rockMul=1;bonusTime=0;
  const bought={};
  const grid=document.getElementById('shop-items');
  document.getElementById('shop').style.display='flex';
  function render(){
    document.getElementById('shop-money').textContent='$'+score;
    grid.innerHTML='';
    for(const it of SHOP){
      const price=priceOf(it);
      const card=document.createElement('div');card.className='scard';
      const owned=it.once&&bought[it.key];
      const afford=score>=price&&!owned;
      card.innerHTML='<div class="sname">'+it.name+'</div><div class="sdesc">'+it.desc+'</div>';
      const b=document.createElement('button');
      b.textContent=owned?'✓ Đã mua':'Mua $'+price;
      b.disabled=!afford;
      b.onclick=(function(item,pr){return function(){
        if(score<pr||(item.once&&bought[item.key]))return;
        score-=pr;
        if(item.key==='dyn')dynamite++;
        else if(item.key==='pot'){pullBoost=1.8;bought.pot=1;}
        else if(item.key==='cof'){bonusTime+=8;bought.cof=1;}
        else if(item.key==='clov'){cloverMul=2;bought.clov=1;}
        else if(item.key==='book'){rockMul=3;bought.book=1;}
        render();
      };})(it,price);
      card.appendChild(b);grid.appendChild(card);
    }
  }
  render();
}

/* ── DRAW ITEMS ──────────────────────────────── */
function tag(o,text,color,bg){
  const px=o.x,py=o.y+o.r+16;
  ctx.font='bold 12px Nunito,sans-serif';ctx.textAlign='center';
  if(bg){
    const tw=ctx.measureText(text).width;
    ctx.fillStyle=bg;
    roundRect2(px-tw/2-5,py-13,tw+10,16,8);ctx.fill();
  }
  ctx.fillStyle=color;ctx.fillText(text,px,py);
}
function roundRect2(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function drawCat(o){
  const s=o.r*2;
  ctx.save();
  // Cute glow ring
  ctx.shadowColor='rgba(255,220,80,.7)';ctx.shadowBlur=18;
  if(catImg.ok)ctx.drawImage(catImg,o.x-o.r,o.y-o.r,s,s);
  else{
    ctx.fillStyle='#ffde7a';
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();
    ctx.fillStyle='#c47000';ctx.font='bold '+(o.r*.9)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐱',o.x,o.y);ctx.textBaseline='alphabetic';
  }
  ctx.restore();
  tag(o,'$'+o.value,'#3a1800','#ffe066');
}

function drawDiamond(o){
  ctx.save();

  if(otoImg.ok){

    const maxSize = o.r * 3.5;

    const ratio = Math.min(
      maxSize / otoImg.width,
      maxSize / otoImg.height
    );

    const w = otoImg.width * ratio;
    const h = otoImg.height * ratio;

    ctx.drawImage(
      otoImg,
      o.x - w/2,
      o.y - h/2,
      w,
      h
    );
    tag(o,'$'+o.value,'#5a4200','#ffd54f');
}
}

function drawRock(o){
  const img=ROCK_IMGS[o.img]||catImg,s=o.r*2;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=12;ctx.shadowOffsetY=3;
  if(img.ok)ctx.drawImage(img,o.x-o.r,o.y-o.r,s,s);
  else{
    ctx.fillStyle='#9b8060';ctx.beginPath();
    // Rocky irregular shape
    ctx.save();ctx.translate(o.x,o.y);
    ctx.beginPath();ctx.moveTo(-o.r*.9,o.r*.2);ctx.lineTo(-o.r*.5,-o.r*.8);ctx.lineTo(o.r*.2,-o.r*.9);ctx.lineTo(o.r*.9,-o.r*.2);ctx.lineTo(o.r*.7,o.r*.8);ctx.lineTo(-o.r*.3,o.r*.9);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  tag(o,'$'+o.value,'#fff8ee','rgba(0,0,0,.4)');
}


function drawMystery(o){
  ctx.save();

  if(vesoImg.ok){

    const maxSize = o.r * 3.5;

    const ratio = Math.min(
      maxSize / vesoImg.width,
      maxSize / vesoImg.height
    );

    const w = vesoImg.width * ratio;
    const h = vesoImg.height * ratio;

    ctx.drawImage(
      vesoImg,
      o.x - w/2,
      o.y - h/2,
      w,
      h
    );
    tag(o,'$'+o.value,'#5a4200','#ffd54f');
  }

  ctx.restore();
}

function drawItem(o){
  if(o.type==='cat')drawCat(o);
  else if(o.type==='diamond')drawDiamond(o);
  else if(o.type==='rock'||o.type==='ielts')drawRock(o);
  else drawMystery(o);
}

/* ── BANNER ──────────────────────────────────── */
function showBanner(q){if(q)banner={kind:q.kind,text:q.text,t:9};}
function drawBanner(){
  if(!banner)return;
  const bw=800,bh=90,bx=(W-bw)/2,by=8;
  ctx.save();ctx.globalAlpha=Math.min(1,banner.t*.8);
  ctx.fillStyle='#fff8ee';roundRect2(bx,by,bw,bh,14);ctx.fill();
  ctx.strokeStyle='#f5c842';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#c46000';ctx.font='bold 13px Nunito,sans-serif';ctx.textAlign='left';
  ctx.fillText('Ô HI — '+banner.kind,bx+14,by+22);
  ctx.fillStyle='#6b3a00';ctx.font='12px Nunito,sans-serif';
  // wrap text
  const words=banner.text.split(' '),maxW=bw-28;let line='',ly=by+40;
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,bx+14,ly);line=w;ly+=17;}else line=t;}
  if(line)ctx.fillText(line,bx+14,ly);
  ctx.restore();
}

/* ── MINER ───────────────────────────────────── */
function drawMiner(){
  const x=PIVOT.x,y=GROUND_Y;
  ctx.save();
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y-2,44,8,0,0,7);ctx.fill();
  // Boots
  ctx.fillStyle='#5a3010';ctx.fillRect(x-28,y-20,11,20);ctx.fillRect(x+17,y-20,11,20);
  ctx.fillStyle='#3a1a08';ctx.fillRect(x-30,y-4,15,5);ctx.fillRect(x+15,y-4,15,5);
  // Body — warm brown jacket
  ctx.fillStyle='#c87030';
  ctx.beginPath();ctx.moveTo(x-24,y-20);ctx.lineTo(x-28,y-62);ctx.quadraticCurveTo(x,y-75,x+28,y-62);ctx.lineTo(x+24,y-20);ctx.closePath();ctx.fill();
  // Pocket detail
  ctx.fillStyle='#b06020';ctx.fillRect(x-10,y-50,9,8);ctx.fillRect(x+1,y-50,9,8);
  // Belt
  ctx.fillStyle='#7a4010';ctx.fillRect(x-26,y-24,52,6);
  ctx.fillStyle='#f5c842';ctx.fillRect(x-5,y-24,10,6);
  // Face / head area
  const cx=x,cy=y-88;
  if(faceImg.ok){
    const fw=56,fh=fw*faceImg.naturalHeight/faceImg.naturalWidth;
    ctx.drawImage(faceImg,cx-fw/2,cy-fh/2,fw,fh);
  }else{
    // Cute round head
    ctx.fillStyle='#ffd9a0';ctx.beginPath();ctx.arc(cx,cy,22,0,7);ctx.fill();
    ctx.strokeStyle='#e8a060';ctx.lineWidth=2;ctx.stroke();
    // Eyes
    ctx.fillStyle='#3a1800';ctx.beginPath();ctx.ellipse(cx-7,cy-3,3,4,0,0,7);ctx.ellipse(cx+7,cy-3,3,4,0,0,7);ctx.fill();
    // Smile
    ctx.strokeStyle='#c47000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy+2,8,0.1,Math.PI-.1);ctx.stroke();
  }
  // Hard hat
  // ctx.fillStyle='#ffe066';
  // ctx.beginPath();ctx.ellipse(cx,cy-20,24,8,0,Math.PI,0);ctx.fill();
  // ctx.fillStyle='#ffd020';ctx.fillRect(cx-26,cy-22,52,6);
  // ctx.fillStyle='#ffec88';ctx.fillRect(cx-5,cy-28,10,6);
  // Reel
  const rx=x,ry=y-38,rr=15;
  ctx.fillStyle='#7a4a20';ctx.fillRect(rx-20,ry-2,7,16);ctx.fillRect(rx+13,ry-2,7,16);
  ctx.save();ctx.translate(rx,ry);ctx.rotate(reelSpin);
  ctx.fillStyle='#3a1a08';ctx.beginPath();ctx.arc(0,0,rr,0,7);ctx.fill();
  ctx.strokeStyle='#c87030';ctx.lineWidth=2.5;
  for(let a=0;a<Math.PI*2;a+=Math.PI/3){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);ctx.stroke();}
  ctx.fillStyle='#f5c842';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();
  ctx.restore();ctx.restore();
}

/* ── ROPE & HOOK ─────────────────────────────── */
function drawRope(tip){
  // Segmented rope with slight wave
  ctx.save();
  const dx=tip.x-PIVOT.x,dy=tip.y-PIVOT.y;
  const segs=20;
  ctx.strokeStyle='#c8a060';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(PIVOT.x,PIVOT.y);
  for(let i=1;i<=segs;i++){
    const t=i/segs;
    const rx=PIVOT.x+dx*t,ry=PIVOT.y+dy*t;
    const wave=Math.sin(t*Math.PI*2.5)*2*(1-t);
    ctx.lineTo(rx+wave,ry);
  }
  ctx.stroke();
  // Rope highlight
  ctx.strokeStyle='rgba(255,220,120,.3)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(PIVOT.x,PIVOT.y);ctx.lineTo(tip.x,tip.y);ctx.stroke();
  ctx.restore();
}

function drawHook(tip){
  ctx.save();ctx.translate(tip.x,tip.y);ctx.rotate(-hook.angle);
  // Hook body
  ctx.fillStyle='#e0c070';ctx.strokeStyle='#a08030';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();ctx.stroke();
  // Hook prongs
  ctx.strokeStyle='#c0a040';ctx.lineWidth=3.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.moveTo(-9,0);ctx.lineTo(-12,14);ctx.moveTo(9,0);ctx.lineTo(12,14);ctx.stroke();
  ctx.restore();
}

/* ── FLOAT TEXTS ─────────────────────────────── */
function drawFloatTexts(){
  ctx.save();
  for(const f of floatTexts){
    const a=Math.min(1,f.life*1.5);
    ctx.globalAlpha=a;
    ctx.font='bold 18px Nunito,cursive';
    ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=3;ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);
  }
  ctx.restore();
}

/* ── INLINE HUD (canvas) ─────────────────────── */
function drawBuffIcons(){
  ctx.save();
  ctx.font='bold 14px Nunito,cursive';ctx.textAlign='left';
  let bx=12,by=H-16;
  const buffs=[];
  if(dynamite>0)buffs.push({icon:'🧨',val:'x'+dynamite,c:'#ffe066'});
  if(pullBoost>1)buffs.push({icon:'💪',val:'',c:'#ffa0a0'});
  if(cloverMul>1)buffs.push({icon:'🍀',val:'',c:'#a0ffa0'});
  if(rockMul>1)buffs.push({icon:'📖',val:'',c:'#a0d0ff'});
  for(const b of buffs){
    ctx.fillStyle='rgba(0,0,0,.5)';roundRect2(bx-4,by-17,56,22,8);ctx.fill();
    ctx.fillStyle=b.c;ctx.fillText(b.icon+' '+b.val,bx,by);
    bx+=68;
  }
  ctx.restore();
}

/* ── RENDER ──────────────────────────────────── */
function render(){
  ctx.drawImage(bg,0,0);
  for(const c of clouds)drawCloud(c);
  const tip=hookTip();
  drawRope(tip);
  for(const o of items)if(!o.gone)drawItem(o);
  drawHook(tip);
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*1.4);
    ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawMiner();
  drawFloatTexts();
  drawBuffIcons();
  drawBanner();
}

/* ── LOOP ────────────────────────────────────── */
function loop(ts){
  const dt=Math.min(0.05,(ts-lastTs)/1000||0);lastTs=ts;
  update(dt);render();
  requestAnimationFrame(loop);
}

cv.addEventListener('mousedown',fireHook);
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();fireHook();}
  if(e.code==='ArrowUp'){e.preventDefault();useDynamite();}
});
document.getElementById('ov-btn').addEventListener('click',function(){newLevel(true);});
document.getElementById('shop-go').addEventListener('click',function(){newLevel(false);});
const ieltsBtn=document.getElementById('ielts-toggle');
ieltsBtn.addEventListener('click',function(){ieltsOn=!ieltsOn;ieltsBtn.classList.toggle('off',!ieltsOn);if(!ieltsOn)banner=null;});
const soundBtn=document.getElementById('sound-toggle');
soundBtn.addEventListener('click',function(){audioOn=!audioOn;soundBtn.textContent=audioOn?'🔊':'🔇';soundBtn.classList.toggle('off',!audioOn);if(audioOn)tone(880,0.1,'square',0.12);});

buildBackground();
newLevel(true);
requestAnimationFrame(loop);

const noBtn = document.getElementById('shop-no');
const shop = document.getElementById('shop');
const originalParent = document.getElementById('no-buy-zone');

let returnTimer = null;

const trollTexts = [
  "Không mua",
  "Đố anh bắt được em",
  "Mua đi mà",
  "Ơ kìa",
  "Đừng bấm",
  "Nhào dzô"
];

function resetNoButton() {
  clearTimeout(returnTimer);

  originalParent.appendChild(noBtn);

  noBtn.style.position = 'static';
  noBtn.style.left = '';
  noBtn.style.top = '';
  noBtn.style.transform = '';
  noBtn.style.zIndex = '';

  noBtn.textContent = 'Không mua';
}

function moveNoButton() {
  clearTimeout(returnTimer);

  noBtn.textContent =
    trollTexts[Math.floor(Math.random() * trollTexts.length)];

  if (noBtn.parentElement !== shop) {
    shop.appendChild(noBtn);

    noBtn.style.position = 'absolute';
    noBtn.style.zIndex = '9999';
  }

  const maxX = shop.clientWidth - noBtn.offsetWidth - 20;
  const maxY = shop.clientHeight - noBtn.offsetHeight - 20;

  noBtn.style.left = (10 + Math.random() * maxX) + 'px';
  noBtn.style.top = (10 + Math.random() * maxY) + 'px';

  returnTimer = setTimeout(resetNoButton, 1000);
}

noBtn.addEventListener('mouseenter', moveNoButton);

noBtn.addEventListener('mousedown', function(e) {
  e.preventDefault();
  moveNoButton();
});

// Khởi tạo vị trí ban đầu
resetNoButton();

</script>
